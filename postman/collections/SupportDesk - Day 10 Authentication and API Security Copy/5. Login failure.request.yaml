$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "incorrect-password"
    }
scripts:
  - type: afterResponse
    code: pm.test('wrong password is rejected', () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000

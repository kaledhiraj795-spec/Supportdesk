$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Password response check",
      "email": "{{passwordCheckEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('passwordCheckEmail', 'day10.password-check+' + Date.now() + '@example.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('registration succeeds', () => pm.response.to.have.status(201));
      pm.test('response never contains credentials', () => {
        pm.expect(pm.response.text()).not.to.include('passwordHash');
        pm.expect(pm.response.text()).not.to.include(pm.environment.get('customerPassword'));
      });
    language: text/javascript
order: 18000

$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Day 10 Customer",
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('customerEmail', 'day10.customer+' + Date.now() + '@example.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('customer registered', () => pm.response.to.have.status(201));
      pm.test('credentials are excluded', () => {
        const text = pm.response.text();
        pm.expect(text).not.to.include('passwordHash');
        pm.expect(text).not.to.include(pm.environment.get('customerPassword'));
        pm.expect(pm.response.json().data.role).to.eql('customer');
      });
    language: text/javascript
order: 1000
